name: Generate Keystore

on:
  workflow_dispatch:
    inputs:
      key_alias:
        description: "Key alias (e.g. mykey)"
        required: true
        default: "mykey"
      key_password:
        description: "Key password (min 6 chars)"
        required: true
      store_password:
        description: "Keystore password (min 6 chars)"
        required: true
      dname:
        description: "DN (e.g. CN=MyApp,O=MyOrg,C=CN)"
        required: true
        default: "CN=MyApp,O=MyOrg,C=CN"

jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - name: Generate keystore
        run: |
          keytool -genkey -v \
            -keystore release.keystore \
            -alias "${{ github.event.inputs.key_alias }}" \
            -keyalg RSA -keysize 2048 -validity 36500 \
            -storepass "${{ github.event.inputs.store_password }}" \
            -keypass "${{ github.event.inputs.key_password }}" \
            -dname "${{ github.event.inputs.dname }}" \
            -noprompt

      - name: Output base64
        run: |
          echo "======== KEYSTORE_BASE64 START ========"
          base64 -w0 release.keystore
          echo ""
          echo "======== KEYSTORE_BASE64 END ========"
          echo ""
          echo "KEY_ALIAS    : ${{ github.event.inputs.key_alias }}"
          echo "KEY_PASSWORD : ${{ github.event.inputs.key_password }}"
          echo "STORE_PASSWORD: ${{ github.event.inputs.store_password }}"

      - name: Write secrets to repo (KEYSTORE_BASE64 / KEY_ALIAS / KEY_PASSWORD / KEYSTORE_PASSWORD)
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          K_ALIAS: ${{ github.event.inputs.key_alias }}
          K_PASSWORD: ${{ github.event.inputs.key_password }}
          S_PASSWORD: ${{ github.event.inputs.store_password }}
        run: |
          pip install --break-system-packages pynacl -q
          python3 - <<'PY'
          import os, base64, json, urllib.request
          from nacl.public import PublicKey, SealedBox

          pat = os.environ['GH_PAT']
          owner, repo = 'slepoh', 'Pakr'

          # 1) 取仓库公钥
          req = urllib.request.Request(
              f'https://api.github.com/repos/{owner}/{repo}/actions/secrets/public-key',
              headers={
                  'Authorization': f'Bearer {pat}',
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
              })
          pk = json.load(urllib.request.urlopen(req))
          box = SealedBox(PublicKey(base64.b64decode(pk['key'])))

          # 2) 加密并写入一个 secret
          def put(name, value):
              enc = base64.b64encode(box.encrypt(value.encode('utf-8'))).decode('ascii')
              body = json.dumps({'encrypted_value': enc, 'key_id': pk['key_id']}).encode('utf-8')
              r = urllib.request.Request(
                  f'https://api.github.com/repos/{owner}/{repo}/actions/secrets/{name}',
                  data=body,
                  headers={
                      'Authorization': f'Bearer {pat}',
                      'Accept': 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2022-11-28',
                      'Content-Type': 'application/json',
                  },
                  method='PUT')
              with urllib.request.urlopen(r) as resp:
                  print(f'PUT {name} -> {resp.status}')

          # 3) 读取刚生成的密钥库并写回四个 Secret
          with open('release.keystore', 'rb') as f:
              kb64 = base64.b64encode(f.read()).decode('ascii')
          put('KEYSTORE_BASE64', kb64)
          put('KEY_ALIAS', os.environ['K_ALIAS'])
          put('KEY_PASSWORD', os.environ['K_PASSWORD'])
          put('KEYSTORE_PASSWORD', os.environ['S_PASSWORD'])
          print('SECRETS_WRITTEN')
          PY
