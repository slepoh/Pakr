name: Build APK
run-name: Build ${{ github.event.inputs.build_id }}
on:
  workflow_dispatch:
    inputs:
      app_url:
        description: Target URL
        required: true
      app_name:
        description: App Name
        required: true
      package_name:
        description: Package Name
        required: true
      version_name:
        description: Version Name
        required: true
        default: 1.0.0
      icon_url:
        description: Icon Image URL (optional, leave empty to use repo logo.jpg)
        required: false
        default: ''
      show_disclaimer:
        description: Show startup disclaimer on first launch (true/false)
        required: false
        default: 'true'
      disclaimer_text:
        description: Custom disclaimer text (Markdown supported, replaces built-in)
        required: false
        default: ''
      no_screenshot:
        description: Disable screenshot & screen recording (FLAG_SECURE, true/false)
        required: false
        default: 'false'
      pull_refresh:
        description: 'Pull-to-refresh gesture in WebView (true/false, default true)'
        required: false
        default: 'true'
      show_statusbar:
        description: Show the system status bar instead of fullscreen immersive (true/false)
        required: false
        default: 'false'
      build_id:
        description: Caller-supplied build id (echoed into run name for precise lookup)
        required: false
        default: ''
# 发布 Release 资产需要写权限（仓库若把默认 GITHUB_TOKEN 设为只读，缺这段会 403）
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # sdk-packages-fix：action 默认 'tools platform-tools' 含已被 Google 下线的 legacy
          # `tools` 包，会以 "Failed to find package 'tools'" 直接失败，故显式覆盖。
          packages: 'platform-tools build-tools;34.0.0 platforms;android-34'

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Inject parameters
        env:
          IN_APP_URL: ${{ github.event.inputs.app_url }}
          IN_APP_NAME: ${{ github.event.inputs.app_name }}
          IN_PACKAGE_NAME: ${{ github.event.inputs.package_name }}
          IN_VERSION_NAME: ${{ github.event.inputs.version_name }}
          IN_SHOW_DISCLAIMER: ${{ github.event.inputs.show_disclaimer }}
          IN_DISCLAIMER_TEXT: ${{ github.event.inputs.disclaimer_text }}
          IN_NO_SCREENSHOT: ${{ github.event.inputs.no_screenshot }}
          IN_PULL_REFRESH: ${{ github.event.inputs.pull_refresh }}
          IN_SHOW_STATUSBAR: ${{ github.event.inputs.show_statusbar }}
        run: |
          python3 - <<'PY'
          import os

          def replace_in_file(path, mapping):
              with open(path, 'r', encoding='utf-8') as f:
                  content = f.read()
              for old, new in mapping.items():
                  content = content.replace(old, new)
              with open(path, 'w', encoding='utf-8') as f:
                  f.write(content)

          app_url = os.environ['IN_APP_URL']
          app_name = os.environ['IN_APP_NAME']
          pkg = os.environ['IN_PACKAGE_NAME']
          ver = os.environ['IN_VERSION_NAME']

          parts = (ver.split('.') + ['0', '0', '0'])[:3]
          try:
              vc = int(parts[0]) * 10000 + int(parts[1]) * 100 + int(parts[2])
          except ValueError:
              vc = 1

          replace_in_file('app/src/main/java/com/webviewapp/MainActivity.kt', {'{{APP_URL}}': app_url})
          # SWITCH_PATCH: 构建期开关 -> Kotlin 常量（空串视为 false，兼容 GitHub 网页手动触发）
          replace_in_file('app/src/main/java/com/webviewapp/MainActivity.kt', {'{{NO_SCREENSHOT}}': 'true' if (os.environ.get('IN_NO_SCREENSHOT') or '').strip().lower() == 'true' else 'false', '{{SHOW_STATUSBAR}}': 'true' if (os.environ.get('IN_SHOW_STATUSBAR') or '').strip().lower() == 'true' else 'false', '{{PULL_REFRESH}}': 'false' if (os.environ.get('IN_PULL_REFRESH') or 'true').strip().lower() == 'false' else 'true'})
          # SWITCH_LOG: 把开关落到构建日志里，便于线上核对本次 APK 的真实取值
          print('switches: no_screenshot=%s show_statusbar=%s' % ((os.environ.get('IN_NO_SCREENSHOT') or '').strip().lower() == 'true', (os.environ.get('IN_SHOW_STATUSBAR') or '').strip().lower() == 'true'))
          replace_in_file('app/src/main/AndroidManifest.xml', {'{{APP_PACKAGE}}': pkg, '{{APP_NAME}}': app_name})
          replace_in_file('app/build.gradle', {'{{APP_PACKAGE}}': pkg, '{{VERSION_NAME}}': ver, '{{VERSION_CODE}}': str(vc)})
          replace_in_file('app/src/main/res/values/strings.xml', {'{{APP_NAME}}': app_name})

          pkg_path = pkg.replace('.', '/')
          os.makedirs(f'app/src/main/java/{pkg_path}', exist_ok=True)

          kt_dir = 'app/src/main/java/com/webviewapp'
          for fname in os.listdir(kt_dir):
              if fname.endswith('.kt'):
                  fpath = os.path.join(kt_dir, fname)
                  replace_in_file(fpath, {'package com.webviewapp': f'package {pkg}'})
                  os.rename(fpath, os.path.join(f'app/src/main/java/{pkg_path}', fname))

          replace_in_file('app/src/main/res/layout/activity_main.xml', {'com.webviewapp': pkg})

          print(f"PKG_PATH is: {pkg_path}")

          # ===== 启动声明页补丁：小窗口呈现 / 可隐藏 / 自定义文案（简易 Markdown） =====
          # 由 webto.work 打包面板驱动：show_disclaimer=false 隐藏，disclaimer_text 非空则替换内置文案。
          import re as _re

          _show_disc = os.environ.get('IN_SHOW_DISCLAIMER', 'true').strip().lower() != 'false'
          _disc_text = os.environ.get('IN_DISCLAIMER_TEXT', '') or ''

          _kt_dir = os.path.join('app/src/main/java', pkg_path)
          _dpath = os.path.join(_kt_dir, 'DisclaimerActivity.kt')
          if os.path.exists(_dpath):
              _src = open(_dpath, encoding='utf-8').read()

              # 1) 去掉全屏标志 —— 小窗口（对话框）呈现的前提
              _src = _re.sub(
                  r'window\.setFlags\(\s*android\.view\.WindowManager\.LayoutParams\.FLAG_FULLSCREEN,\s*android\.view\.WindowManager\.LayoutParams\.FLAG_FULLSCREEN\s*\)',
                  '// fullscreen flag removed: disclaimer renders as a centered dialog', _src)

              _marker = 'setContentView(R.layout.activity_disclaimer)'

              # 2) 隐藏：进入即视为已同意并直达主页，用户看不到声明页
              if not _show_disc and 'SHOW_DISCLAIMER_ENABLED' not in _src:
                  _src = _src.replace(_marker, '''// SHOW_DISCLAIMER_ENABLED=false（构建期注入）：首次启动不再展示声明页
                  getSharedPreferences("app_prefs", MODE_PRIVATE).edit().putBoolean("disc_agreed", true).apply()
                  startActivity(Intent(this, MainActivity::class.java).apply {
                      flags = Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_CLEAR_TASK
                  })
                  finish()
                  return
          ''' + _marker, 1)

              # 3) 小窗口：居中卡片 + 背景变暗 + 圆角白底（不再整屏遮挡）
              if _marker in _src and 'DISCLAIMER_DIALOG_PATCH' not in _src:
                  _src = _src.replace(_marker, _marker + '''
                  // DISCLAIMER_DIALOG_PATCH
                  try {
                      val _dm = resources.displayMetrics
                      window.setLayout((_dm.widthPixels * 0.92).toInt(), (_dm.heightPixels * 0.78).toInt())
                      window.setGravity(android.view.Gravity.CENTER)
                      window.setDimAmount(0.45f)
                      val _bg = android.graphics.drawable.GradientDrawable()
                      _bg.setColor(android.graphics.Color.WHITE)
                      _bg.cornerRadius = 20f * _dm.density
                      window.setBackgroundDrawable(_bg)
                  } catch (e: Exception) { }''', 1)

              # 4) 自定义文案：写入 assets，buildDisclaimerText 优先渲染它（支持 #/##/-/**粗体**）
              if _disc_text.strip():
                  os.makedirs('app/src/main/assets', exist_ok=True)
                  open('app/src/main/assets/disclaimer.txt', 'w', encoding='utf-8').write(_disc_text)
                  if 'readCustomDisclaimer' not in _src:
                      _src = _src.replace(
                          'private fun buildDisclaimerText(): SpannableStringBuilder {',
                          '''private fun readCustomDisclaimer(): String? {
                  return try {
                      assets.open("disclaimer.txt").bufferedReader().use { it.readText() }.trim().ifEmpty { null }
                  } catch (e: Exception) { null }
              }

              private fun appendBoldInline(outSb: SpannableStringBuilder, line: String) {
                  var rest = line
                  while (true) {
                      val i = rest.indexOf("**")
                      if (i < 0) { outSb.append(rest); outSb.append("\\n"); return }
                      outSb.append(rest.substring(0, i))
                      val j = rest.indexOf("**", i + 2)
                      if (j < 0) { outSb.append(rest.substring(i + 2)); outSb.append("\\n"); return }
                      val st = outSb.length
                      outSb.append(rest.substring(i + 2, j))
                      outSb.setSpan(StyleSpan(Typeface.BOLD), st, outSb.length, Spanned.SPAN_EXCLUSIVE_EXCLUSIVE)
                      rest = rest.substring(j + 2)
                  }
              }

              private fun renderMarkdown(srcText: String): SpannableStringBuilder {
                  val outSb = SpannableStringBuilder()
                  for (raw in srcText.replace("\\r\\n", "\\n").split("\\n")) {
                      val line = raw.trimEnd()
                      when {
                          line.startsWith("# ") -> {
                              val st = outSb.length
                              outSb.append(line.removePrefix("# ").trim().replace("**", ""))
                              outSb.setSpan(StyleSpan(Typeface.BOLD), st, outSb.length, Spanned.SPAN_EXCLUSIVE_EXCLUSIVE)
                              outSb.setSpan(RelativeSizeSpan(1.22f), st, outSb.length, Spanned.SPAN_EXCLUSIVE_EXCLUSIVE)
                              outSb.append("\\n\\n")
                          }
                          line.startsWith("## ") -> {
                              val st = outSb.length
                              outSb.append(line.removePrefix("## ").trim().replace("**", ""))
                              outSb.setSpan(StyleSpan(Typeface.BOLD), st, outSb.length, Spanned.SPAN_EXCLUSIVE_EXCLUSIVE)
                              outSb.setSpan(RelativeSizeSpan(1.1f), st, outSb.length, Spanned.SPAN_EXCLUSIVE_EXCLUSIVE)
                              outSb.append("\\n\\n")
                          }
                          line.startsWith("- ") || line.startsWith("* ") -> {
                              outSb.append("•  ")
                              appendBoldInline(outSb, line.substring(2))
                          }
                          line.isBlank() -> outSb.append("\\n")
                          else -> appendBoldInline(outSb, line)
                      }
                  }
                  return outSb
              }

              private fun buildDisclaimerText(): SpannableStringBuilder {
                  val custom = readCustomDisclaimer()
                  if (custom != null) return renderMarkdown(custom)''', 1)

              open(_dpath, 'w', encoding='utf-8').write(_src)
              print('disclaimer patch: DisclaimerActivity.kt updated (show=%s, custom=%dB)' % (_show_disc, len(_disc_text)))

          # 5) 对话框主题：新增样式文件并挂到 DisclaimerActivity（窗口化必需）
          os.makedirs('app/src/main/res/values', exist_ok=True)
          open('app/src/main/res/values/disclaimer_theme.xml', 'w', encoding='utf-8').write(
              '<?xml version="1.0" encoding="utf-8"?>\n'
              '<resources>\n'
              '    <style name="DisclaimerDialogTheme" parent="Theme.AppCompat.Light.Dialog">\n'
              '        <item name="android:windowNoTitle">true</item>\n'
              '        <item name="android:windowBackground">@android:color/transparent</item>\n'
              '        <item name="android:windowIsFloating">true</item>\n'
              '        <item name="android:backgroundDimEnabled">true</item>\n'
              '    </style>\n'
              '</resources>\n')

          _mpath = 'app/src/main/AndroidManifest.xml'
          _manifest = open(_mpath, encoding='utf-8').read()
          if 'DisclaimerDialogTheme' not in _manifest:
              _manifest = _manifest.replace(
                  'android:name=".DisclaimerActivity"',
                  'android:name=".DisclaimerActivity"\n            android:theme="@style/DisclaimerDialogTheme"')
              open(_mpath, 'w', encoding='utf-8').write(_manifest)
              print('disclaimer patch: DisclaimerActivity themed as dialog')

          PY

      - name: Ensure fallback launcher resources
        run: |
          python3 - <<'PY'
          import base64, os
          png = base64.b64decode('iVBORw0KGgoAAAANSUhEUgAAAMAAAADACAIAAADdvvtQAAAAWUlEQVR4nO3BAQ0AAADCoPdPbQ43oAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAfgx1lAABqFDyOQAAAABJRU5ErkJggg==')
          for density in ['mdpi','hdpi','xhdpi','xxhdpi','xxxhdpi']:
              base = f'app/src/main/res/mipmap-{density}'
              os.makedirs(base, exist_ok=True)
              for name in ['ic_launcher.png', 'ic_launcher_round.png']:
                  path = os.path.join(base, name)
                  if not os.path.exists(path) or os.path.getsize(path) < 100:
                      open(path, 'wb').write(png)
          PY

      - name: Process icon
        env:
          ICON_URL: ${{ github.event.inputs.icon_url }}
        run: |
          pip install Pillow -q
          python3 Scripts/process_icon.py

      - name: Build APK (arm64 + armeabi-v7a)
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Sign APK
        env:
          IN_APP_NAME: ${{ github.event.inputs.app_name }}
          IN_VERSION_NAME: ${{ github.event.inputs.version_name }}
        run: |
          KS_B64="${{ secrets.KEYSTORE_BASE64 }}"
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 --decode > /tmp/release.keystore
            KS_PASS="${{ secrets.KEYSTORE_PASSWORD }}"
            KEY_ALIAS="${{ secrets.KEY_ALIAS }}"
            KEY_PASS="${{ secrets.KEY_PASSWORD }}"
          else
            keytool -genkey -v -keystore /tmp/release.keystore -alias debugkey -keyalg RSA -keysize 2048 -validity 3650 -storepass android -keypass android -dname "CN=Debug,O=Debug,C=US" -noprompt
            KS_PASS="android"
            KEY_ALIAS="debugkey"
            KEY_PASS="android"
          fi
          BUILD_TOOLS=$(ls $ANDROID_HOME/build-tools/ | sort -V | tail -1)
          SAFE=$(printf '%s' "$IN_APP_NAME" | tr -c 'A-Za-z0-9_-' '_')
          VER="$IN_VERSION_NAME"
          mkdir -p /tmp/signed
          echo "=== Searching for split APK files ==="
          find app/build -name '*.apk' 2>/dev/null || echo "No APK found in app/build"
          FOUND=0
          while IFS= read -r APK; do
            [ -z "$APK" ] && continue
            echo "Processing: $APK"
            ABI=$(echo "$APK" | grep -oE 'arm64-v8a|armeabi-v7a' | head -1)
            [ -z "$ABI" ] && continue
            OUT="/tmp/signed/${SAFE}_${VER}_${ABI}.apk"
            $ANDROID_HOME/build-tools/$BUILD_TOOLS/zipalign -v -p 4 "$APK" /tmp/aligned_${ABI}.apk
            $ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner sign               --ks /tmp/release.keystore --ks-pass "pass:$KS_PASS"               --ks-key-alias "$KEY_ALIAS" --key-pass "pass:$KEY_PASS"               --out "$OUT" /tmp/aligned_${ABI}.apk
            $ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner verify "$OUT"
            echo "Signed: $OUT"
            FOUND=1
          done < <(find app/build -type f \( -name '*arm64-v8a*release*.apk' -o -name '*armeabi-v7a*release*.apk' -o -path '*/release/*arm64-v8a*.apk' -o -path '*/release/*armeabi-v7a*.apk' \) 2>/dev/null)
          if [ "$FOUND" -ne 1 ]; then
            echo "No split ABI APKs found" >&2
            exit 1
          fi
          ls -la /tmp/signed/
          echo "SIGNED_DIR=/tmp/signed" >> $GITHUB_ENV
          echo "APK_NAME=${SAFE}_${VER}" >> $GITHUB_ENV
      - name: Upload arm64 APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}_arm64-v8a
          path: ${{ env.SIGNED_DIR }}/*arm64-v8a*.apk
          if-no-files-found: warn
          retention-days: 1

      - name: Upload armeabi-v7a APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}_armeabi-v7a
          path: ${{ env.SIGNED_DIR }}/*armeabi-v7a*.apk
          if-no-files-found: warn
          retention-days: 1

      # RELEASE_PUBLISH: 把签名后的 APK 以 .apk 资产发布到 GitHub Release ——
      #   artifact 永远是 zip 且需鉴权，客户端无法直链；Release 资产可保留 .apk 后缀、匿名可下，
      #   平台据此改走直链下载（比 R2 中转快得多）。标签固定 apk-<run_id>，后端凭 run_id 反查。
      - name: Publish APK to GitHub Release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IN_BUILD_ID: ${{ github.event.inputs.build_id }}
        run: |
          set -e
          TAG="apk-${GITHUB_RUN_ID}"
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" \
            --title "${APK_NAME:-apk} (${GITHUB_RUN_ID})" \
            --notes "Automated APK build. build_id=${IN_BUILD_ID:-}" \
            "${SIGNED_DIR}"/*.apk
          echo "release-tag: $TAG"
          gh release view "$TAG" --json assets -q '.assets[] | "release-asset: \(.name) \(.size)B \(.url)"'
